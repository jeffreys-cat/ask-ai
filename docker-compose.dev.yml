services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ask_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ask_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ask_ai
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ask_ai
      INGEST_SOURCE_LOCAL_DIR: /app/.data/ingest-sources
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ingest-sources:/app/.data/ingest-sources
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ask_ai
      INGEST_SOURCE_LOCAL_DIR: /app/.data/ingest-sources
    command: ["pnpm", "worker:ingest"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ingest-sources:/app/.data/ingest-sources
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  ingest-sources:
